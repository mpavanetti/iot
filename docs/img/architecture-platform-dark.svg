="round" paint-order="stroke">TCP :1500</text><text x="232" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">or USB</text><path d="M192,346 C232,346 236,180 272,168" fill="none" stroke="#656c76" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-edge)"/><text x="246" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">same protocol</text><path d="M426,132 L470,132" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="448" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">key =</text><text x="448" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">device</text><path d="M426,160 C446,160 446,184 470,184" fill="none" stroke="#e0662f" stroke-width="1.8" marker-end="url(#arrow-warn)"/><text x="446" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">invalid</text><path d="M670,142 L714,142" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="692" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">every</text><text x="692" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">10 s</text><path d="M918,142 L962,142" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="940" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">upsert</text><path d="M572,206 C572,300 650,376 714,376" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="596" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">live readings (SSE)</text><path d="M1010,206 C1010,262 880,262 846,326" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="930" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">history</text><path d="M1064,206 L1064,326" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="1080" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SQL</text></svg>
