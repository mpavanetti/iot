<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="IoT Center Platform: a reading travels from the Pico W through the gateway, Kafka and Spark Structured Streaming into PostgreSQL; the dashboard reads live data from Kafka and history from PostgreSQL; Streamlit reads PostgreSQL."><title>IoT Center Platform: a reading travels from the Pico W through the gateway, Kafka and Spark Structured Streaming into PostgreSQL; the dashboard reads live data from Kafka and history from PostgreSQL; Streamlit reads PostgreSQL.</title><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="arrow-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0662f"/></marker></defs><rect x="240" y="16" width="944" height="438" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.2"/><text x="256" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">Docker Compose · Raspberry Pi 4 or any Linux host</text><rect x="16" y="96" width="176" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="104.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Pico W + BME280</text><text x="104.0" y="148.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">MicroPython firmware</text><text x="104.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">one JSON line per reading</text><rect x="16" y="300" width="176" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="104.0" y="334.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Simulator</text><text x="104.0" y="352.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">simulate_picow.py</text><text x="104.0" y="368.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">any number of boards</text><rect x="276" y="96" width="150" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="351.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Gateway</text><text x="351.0" y="148.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">validate · stamp</text><text x="351.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">received_at</text><rect x="474" y="78" width="196" height="128" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="572.0" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Kafka</text><text x="572.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">iot.readings</text><text x="572.0" y="156.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">3 partitions · 7 days</text><text x="572.0" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">iot.readings.dlq</text><rect x="718" y="88" width="200" height="108" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="818.0" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Spark</text><text x="818.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">Structured Streaming</text><text x="818.0" y="156.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">master + worker</text><text x="818.0" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">parse · validate · hourly</text><rect x="966" y="78" width="196" height="128" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="1064.0" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">PostgreSQL</text><text x="1064.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">readings</text><text x="1064.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9198a1"